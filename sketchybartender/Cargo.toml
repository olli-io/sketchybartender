[package]
name = "sketchybartender"
version = "0.1.0"
edition = "2021"
description = "High-performance sketchybar helper daemon"

[[bin]]
name = "sketchybartender"
path = "src/main.rs"

[[bin]]
name = "sketchycli"
path = "src/sketchycli.rs"


[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mach2 = "0.6"
libc = "0.2"
chrono = "0.4"
rift-client = { git = "https://github.com/acsandmann/rift", tag = "v0.8.3" }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
